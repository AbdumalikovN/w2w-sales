name: Интерфейс CRM → GitHub Pages

# Публикует интерфейс (index.html + assets/) на GitHub Pages. Netlify проксирует его на w2w-crm.netlify.app,
# поэтому правки интерфейса не требуют деплоя Netlify. API (папка netlify/) деплоится отдельно — см. README.
on:
  push:
    branches: [main]
    paths:
      - "index.tpl.html"
      - "assets/**"
      - "manifest.webmanifest"
      - "scripts/stamp.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Собрать интерфейс
        run: ASSET_VERSION="${GITHUB_SHA::10}" node scripts/stamp.mjs --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
